# Production : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Variables : voir .env.prod.example (copiez-le en .env, remplissez-le, ne le commitez jamais). Guide : docs/DEPLOIEMENT.md
#
# Réseaux : « backend » est interne (aucune sortie, aucun port publié) et porte PostgreSQL et Redis ; « edge » relie le web, l'API
# (envoi d'emails / SMS / stockage objet) et la sauvegarde (copie hors site). Seul le service web publie un port.
name: restaurant

x-restart: &restart
  restart: unless-stopped
x-logging: &logging
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?PG_ADMIN_PASSWORD est obligatoire}
      POSTGRES_DB: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    # File des notifications (BullMQ) : AOF activé pour ne perdre aucun envoi en attente au redémarrage.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire}"]
    environment: { REDISCLI_AUTH: "${REDIS_PASSWORD}" }
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Job ponctuel : rôles SQL, migrations, droits, rls.sql, seed. Rejoué à chaque `up` (idempotent) ; l'API attend sa réussite.
  migrate:
    <<: *logging
    build: { context: ., dockerfile: docker/api.Dockerfile, target: tools }
    image: restaurant-tools:${APP_VERSION:-local}
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGHOST: postgres
      PG_ADMIN_USER: ${PG_ADMIN_USER:-postgres}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD}
      DB_NAME: ${DB_NAME:-restaurant}
      DB_OWNER_USER: ${DB_OWNER_USER:-restaurant_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD est obligatoire}
      DB_APP_USER: ${DB_APP_USER:-restaurant_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD est obligatoire}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:?SEED_SUPERADMIN_EMAIL est obligatoire}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?SEED_SUPERADMIN_PASSWORD est obligatoire}
    networks: [backend]

  api:
    <<: [*restart, *logging]
    build: { context: ., dockerfile: docker/api.Dockerfile, target: runtime }
    image: restaurant-api:${APP_VERSION:-local}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      # Rôle applicatif restreint (jamais le compte administrateur : la RLS serait ignorée). L'API refuse de démarrer sinon.
      DATABASE_URL: postgresql://${DB_APP_USER:-restaurant_app}:${DB_APP_PASSWORD}@postgres:5432/${DB_NAME:-restaurant}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET est obligatoire}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY est obligatoire}
      TRACKING_TOKEN_SECRET: ${TRACKING_TOKEN_SECRET:?TRACKING_TOKEN_SECRET est obligatoire}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL est obligatoire}
      APP_URL: ${APP_URL:?APP_URL est obligatoire}
      CORS_ORIGIN: ${CORS_ORIGIN:-${APP_URL}}
      # nginx (1) [+ terminateur TLS / répartiteur de charge devant lui (+1)] : nombre RÉEL de proxys devant l'API.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER: ${SWAGGER:-off}
      COOKIE_SECURE: ${COOKIE_SECURE:-on}
      LOG_FORMAT: json
      # Notifications : Redis obligatoire en production (reprises après redémarrage).
      NOTIFICATIONS_QUEUE: bullmq
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      ALLOW_MAIL_LOG: ${ALLOW_MAIL_LOG:-off}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      SMS_DRIVER: ${SMS_DRIVER:-log}
      SMS_FROM: ${SMS_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_METHOD: ${SMS_HTTP_METHOD:-POST}
      SMS_HTTP_HEADERS: ${SMS_HTTP_HEADERS:-}
      SMS_HTTP_CONTENT_TYPE: ${SMS_HTTP_CONTENT_TYPE:-json}
      SMS_HTTP_BODY: ${SMS_HTTP_BODY:-}
      # Fichiers : disque (volume « uploads ») par défaut, ou stockage objet compatible S3.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    volumes: [uploads:/data/uploads]
    networks: [backend, edge]
    # La sonde de l'image (HEALTHCHECK) interroge /api/v1/health : base + Redis.

  web:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { VITE_ROOT_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN est obligatoire}" }
    image: restaurant-web:${APP_VERSION:-local}
    depends_on: { api: { condition: service_healthy } }
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    # Unique port publié. Par défaut seulement sur la machine (derrière un terminateur TLS) ; WEB_BIND=0.0.0.0 pour l'exposer.
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    networks: [edge]

  # Sauvegarde chiffrée quotidienne (pg_dump) + rotation + copie hors site facultative. Voir scripts/ops/backup.sh.
  backup:
    <<: [*restart, *logging]
    build: { context: ., dockerfile: docker/ops.Dockerfile }
    image: restaurant-ops:${APP_VERSION:-local}
    depends_on: { migrate: { condition: service_completed_successfully } }
    command: ["/ops/backup-scheduler.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${PG_ADMIN_USER:-postgres}
      PGPASSWORD: ${PG_ADMIN_PASSWORD}
      PGDATABASE: ${DB_NAME:-restaurant}
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE est obligatoire (chiffrement des sauvegardes)}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-restaurant-backups}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes: [backups:/backups]
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "/ops/backup-status.sh"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 5m

networks:
  backend: { internal: true }
  edge: {}

volumes:
  pgdata:
  redisdata:
  uploads:
  backups:
